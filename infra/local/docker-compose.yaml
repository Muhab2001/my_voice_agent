services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks: [internal]
  migrate:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.app
      args:
        TARGET: "@voice/scripts"
    env_file: ../../.env
    environment:
      DATABASE_URL: postgres://voice:voice@postgres:5432/voice
    working_dir: /app/apps/scripts
    command: ["bun", "src/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
  api:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.app
      args:
        TARGET: "@voice/api"
    env_file: ../../.env
    environment:
      DATABASE_URL: postgres://voice:voice@postgres:5432/voice
      PORT: "3000"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
    working_dir: /app/apps/api
    command: ["bun", "src/main.ts"]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s
    networks: [internal]
  web:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.app
      args:
        TARGET: "@voice/web"
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    working_dir: /app/apps/web
    command: ["bun", "run", "dev"]
    volumes:
      - ../../apps/web/src:/app/apps/web/src
      - ../../apps/web/public:/app/apps/web/public
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    networks: [internal]
networks:
  internal: {}
volumes:
  postgres_data:
