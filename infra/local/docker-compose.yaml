services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks: [internal]
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks: [internal]
  migrate:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.api
    env_file: ../../.env
    environment:
      DATABASE_URL: postgres://voice:voice@postgres:5432/voice
      REDIS_URL: redis://redis:6379
    working_dir: /app/apps/scripts
    command: ["bun", "src/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
  api:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.api
    env_file: ../../.env
    environment:
      DATABASE_URL: postgres://voice:voice@postgres:5432/voice
      REDIS_URL: redis://redis:6379
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 15s
    networks: [internal]
networks:
  internal: {}
volumes:
  postgres_data:
  redis_data:
